name: Verify and build userscript

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "dist/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build userscript
        run: npm run build

      - name: Upload test userscript
        uses: actions/upload-artifact@v4
        with:
          name: training-manager-test-userscript
          path: "dist/Torn Company Training Manager.user.js"
          if-no-files-found: error
          retention-days: 7

      - name: Run tests
        run: npm test

      - name: Commit built userscript on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/Torn Company Training Manager.user.js"
          if git diff --cached --quiet; then
            echo "No userscript changes to commit."
          else
            git commit -m "build: update userscript"
            git push
          fi
